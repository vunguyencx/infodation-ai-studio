<!DOCTYPE html>
<html lang="en" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="meta.solutions">Explore solutions — Infodation AI Studio</title>
<meta name="description" data-i18n-attr="content:meta.desc" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/css/main.css">
<script src="assets/js/palettes.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/theme.js"></script>
</head>
<body>
<div class="page">
<div data-layout="header" data-current="solutions"></div>

<main id="main">
<section class="wrap m-head">
  <nav class="crumb intro" style="--i:0" aria-label="Breadcrumb"><a href="index.html">AI Studio</a> / <b data-i18n="market.crumb"></b></nav>
  <div class="sec-head" style="gap:20px 48px">
    <h1 class="m-h1 intro" style="--i:1" data-i18n="market.title"></h1>
    <p class="lead intro" style="--i:2;max-width:420px" data-i18n="market.lead" data-i18n-vars='{"n":7}'></p>
  </div>
</section>

<section class="controls">
  <div class="wrap inner">
    <label class="search">
      <span data-icon="search"></span>
      <input type="search" id="q" data-i18n-attr="placeholder:market.search,aria-label:market.searchAria">
    </label>
    <div class="filters" role="group" id="filters" data-i18n-attr="aria-label:market.filtersAria"></div>
  </div>
</section>

<section class="wrap results">
  <span class="result-count" id="count" aria-live="polite"></span>
  <div class="grid-fill asm-stage" id="grid" data-asm-stagger=".07"></div>
  <div class="custom-cta" data-asm="rise" data-tilt="3">
    <div style="display:flex;flex-direction:column;gap:8px">
      <b data-i18n="market.customT"></b>
      <span data-i18n="market.customX"></span>
    </div>
    <a href="index.html#contact" class="btn btn-accent btn-md" data-i18n="market.customBtn"></a>
  </div>
</section>
</main>

<div data-layout="footer"></div>
</div>

<script src="assets/js/i18n/en.js"></script>
<script src="assets/js/i18n/vi.js"></script>
<script src="assets/js/i18n/nl.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data/solutions.js"></script>
<script src="assets/js/docs.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/pages/solutions.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
