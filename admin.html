<!DOCTYPE html>
<html lang="en" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title data-i18n="meta.admin">Admin settings — Infodation AI Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/css/main.css">
<script src="assets/js/palettes.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/theme.js"></script>
</head>
<body>
<div class="page">
<div data-layout="header"></div>

<main id="main">
<section class="wrap m-head">
  <nav class="crumb" aria-label="Breadcrumb"><a href="index.html">AI Studio</a> / <b data-i18n="admin.crumb"></b></nav>
  <div class="sec-head" style="gap:20px 48px">
    <h1 class="m-h1" data-i18n="admin.title"></h1>
    <p class="lead" style="max-width:460px" data-i18n="admin.lead"></p>
  </div>
  <div class="admin-tabs" role="tablist" data-i18n-attr="aria-label:admin.title">
    <button type="button" role="tab" id="tab-settings" aria-controls="panel-settings" data-tab="settings" data-i18n="admin.tabSettings"></button>
    <button type="button" role="tab" id="tab-documents" aria-controls="panel-documents" data-tab="documents" data-i18n="admin.tabDocs"></button>
  </div>
</section>

<div role="tabpanel" id="panel-settings" aria-labelledby="tab-settings">
<section class="wrap" style="display:flex;flex-direction:column;gap:20px;padding-bottom:40px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <h2 class="h2-sm" style="font-size:30px" data-i18n="admin.palH"></h2>
    <p class="lead" style="font-size:15px" data-i18n="admin.palX"></p>
  </div>
  <div class="admin-grid" role="radiogroup" id="palettes" data-i18n-attr="aria-label:admin.palH"></div>
</section>

<section class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;padding-bottom:96px">
  <div class="admin-box">
    <h2 class="h2-sm" style="font-size:24px" data-i18n="admin.langH"></h2>
    <p class="lead" style="font-size:15px" data-i18n="admin.langX"></p>
    <div class="filters" role="radiogroup" id="langs"></div>
    <a href="index.html" class="btn btn-ink btn-md" style="align-self:flex-start;margin-top:auto" data-i18n="admin.preview"></a>
  </div>
  <div class="admin-box">
    <h2 class="h2-sm" style="font-size:24px" data-i18n="admin.pubH"></h2>
    <p class="lead" style="font-size:15px" data-i18n="admin.pubX"></p>
    <pre id="cfg"></pre>
    <div class="row" style="gap:10px">
      <button type="button" class="btn btn-accent btn-sm" id="dl" data-i18n="admin.download"></button>
      <button type="button" class="btn btn-outline btn-sm" style="padding:10px 16px" id="copy" data-i18n="admin.copy"></button>
      <button type="button" class="btn btn-outline btn-sm" style="padding:10px 16px" id="reset" data-i18n="admin.reset"></button>
    </div>
  </div>
</section>
</div>

<div role="tabpanel" id="panel-documents" aria-labelledby="tab-documents" hidden>
<section class="wrap" style="display:flex;flex-direction:column;gap:20px;padding-bottom:96px">
  <div style="display:flex;flex-wrap:wrap;gap:16px 40px;align-items:flex-end;justify-content:space-between">
    <div style="display:flex;flex-direction:column;gap:6px;flex:1 1 420px">
      <h2 class="h2-sm" style="font-size:30px" data-i18n="admin.docsH"></h2>
      <p class="lead" style="font-size:15px" data-i18n="admin.docsX"></p>
    </div>
    <div class="admin-key">
      <label><span data-i18n="admin.keyL"></span><input type="password" id="admin-key" autocomplete="off" data-i18n-attr="placeholder:admin.keyHelp"></label>
      <span class="key-status" id="srv-status" role="status" aria-live="polite"></span>
    </div>
  </div>
  <div class="doc-groups" id="doc-groups"></div>
</section>
</div>
</main>

<div data-layout="footer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="assets/js/i18n/en.js"></script>
<script src="assets/js/i18n/vi.js"></script>
<script src="assets/js/i18n/nl.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data/solutions.js"></script>
<script src="assets/js/docs.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/reveal.js"></script>
<script src="assets/js/pages/admin.js"></script>
<script src="assets/js/pages/admin-docs.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
