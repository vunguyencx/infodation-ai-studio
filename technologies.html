<!DOCTYPE html>
<html lang="en" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="meta.tech">Technology — Infodation AI Studio</title>
<meta name="description" data-i18n-attr="content:tech.lead" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/tech.css">
<script src="assets/js/palettes.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/theme.js"></script>
</head>
<body>
<div class="page">
<div data-layout="header" data-current="tech"></div>

<main id="main">
<!-- HERO: architecture stack -->
<section class="wrap t-hero">
  <div class="t-copy">
    <nav class="crumb intro" style="--i:0" aria-label="Breadcrumb"><a href="index.html">AI Studio</a> / <b data-i18n="tech.crumb"></b></nav>
    <h1 class="m-h1 intro" style="--i:1" data-i18n="tech.h1"></h1>
    <p class="hero-lead intro" style="--i:2" data-i18n="tech.lead"></p>
    <div class="stats intro" style="--i:3" id="tstats"></div>
    <div class="row intro" style="--i:4">
      <a href="#flow" class="btn btn-accent btn-lg"><span data-i18n="tech.flowLabel"></span> ↓</a>
    </div>
  </div>
  <div class="tstack" role="group" tabindex="0">
    <div class="tstack-inner" id="tstack"></div>
    <div class="tstack-cap" id="tstack-cap" aria-hidden="true"></div>
    <div class="tstack-hint" id="tstack-hint"></div>
  </div>
</section>

<!-- FLOW DIAGRAM -->
<section id="flow" class="band-white">
  <div class="wrap sec" style="gap:36px">
    <div class="sec-head">
      <div style="flex:1 1 560px;display:flex;flex-direction:column;gap:14px">
        <span class="eyebrow" data-asm="left" data-i18n="tech.flowLabel"></span>
        <h2 class="h2" data-split data-i18n="tech.flowTitle"></h2>
      </div>
      <p class="lead" style="flex:1 1 340px;max-width:420px" data-asm="right" data-i18n="tech.flowLead"></p>
    </div>
    <div class="asm-stage">
      <div class="flow-card" data-asm="screen" data-asm-end=".55">
        <div class="scroll-x"><div id="flow-svg"></div></div>
        <div class="flow-hint" data-i18n="tech.flowHint"></div>
      </div>
    </div>
  </div>
</section>

<!-- CLUSTERS -->
<section class="wrap sec" style="gap:40px">
  <div class="sec-head">
    <div style="flex:1 1 560px;display:flex;flex-direction:column;gap:14px">
      <span class="eyebrow" data-asm="left" data-i18n="tech.cardsLabel"></span>
      <h2 class="h2" data-split data-i18n="tech.cardsTitle"></h2>
    </div>
  </div>
  <div class="tcards" id="tcards" data-asm-stagger=".08"></div>
</section>

<!-- MATRIX -->
<section class="band-white">
  <div class="wrap sec" style="gap:36px">
    <div class="sec-head">
      <div style="flex:1 1 560px;display:flex;flex-direction:column;gap:14px">
        <span class="eyebrow" data-asm="left" data-i18n="tech.mapLabel"></span>
        <h2 class="h2" data-split data-i18n="tech.mapTitle"></h2>
      </div>
      <p class="lead" style="flex:1 1 340px;max-width:420px" data-asm="right" data-i18n="tech.mapLead"></p>
    </div>
    <div class="matrix-card" data-asm="rise">
      <div class="scroll-x"><div class="matrix" id="matrix" role="group" data-i18n-attr="aria-label:tech.mapAria" data-asm-stagger=".03"></div></div>
    </div>
  </div>
</section>

<!-- PRINCIPLES -->
<section class="wrap sec" style="gap:40px">
  <div class="sec-head">
    <div style="flex:1 1 560px;display:flex;flex-direction:column;gap:14px">
      <span class="eyebrow" data-asm="left" data-i18n="tech.prLabel"></span>
      <h2 class="h2" data-split data-i18n="tech.prTitle"></h2>
    </div>
  </div>
  <div class="prs" id="prs" data-asm-stagger=".1"></div>
  <div class="custom-cta" data-asm="rise" data-tilt="3">
    <div style="display:flex;flex-direction:column;gap:8px">
      <b data-i18n="tech.ctaT"></b>
      <span data-i18n="tech.ctaX"></span>
    </div>
    <a href="index.html#contact" class="btn btn-accent btn-md" data-i18n="tech.ctaBtn"></a>
  </div>
</section>
</main>

<div data-layout="footer"></div>
</div>

<script src="assets/js/i18n/en.js"></script>
<script src="assets/js/i18n/vi.js"></script>
<script src="assets/js/i18n/nl.js"></script>
<script src="assets/js/i18n/tech.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/data/solutions.js"></script>
<script src="assets/js/docs.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/reveal.js"></script>
<script src="assets/js/pages/tech.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
